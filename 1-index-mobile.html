<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Caixa Preta - Mobile</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="styles-mobile.css">
    <script src="audio-manager.js"></script>
    <script src="audio-button.js"></script>
    <style>
        .container {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
            width: 100vw;
            height: 100vh;
            padding: 20px;
            padding-bottom: 100px; /* Espaço para controles */
            box-sizing: border-box;
        }

        .box-3d {
            width: 180px;
            height: 180px;
            position: relative;
            transform-style: preserve-3d;
            animation: float 3s ease-in-out infinite;
            margin: 0 auto;
            z-index: 2;
            cursor: pointer;
            touch-action: manipulation;
            /* Caixa fechada: perspectiva, mas face front alinhada */
            transform: rotateY(-20deg) rotateX(18deg) translateY(0);
            transition: transform 0.6s cubic-bezier(.77,0,.18,1);
        }

        /* Efeito de toque para mobile */
        .box-3d:active {
            transform: rotateY(15deg) rotateX(15deg) scale(1.05);
        }

        .face {
            position: absolute;
            width: 180px;
            height: 180px;
            background: var(--bg-dark);
            border: 2px solid var(--neon-cyan);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            font-weight: bold;
            color: var(--neon-cyan);
            text-shadow: 0 0 8px var(--neon-cyan);
            box-shadow: 0 0 30px #00fff7, 0 0 60px #0ff;
            opacity: 0.98;
            transition: transform 1s cubic-bezier(.77,0,.18,1), opacity 0.7s;
        }

        .front {
            transform-origin: center center;
            transform: translateZ(90px) rotateY(0deg);
        }
        .back { transform: translateZ(-90px) rotateY(180deg); }
        .right { transform: translateX(90px) rotateY(90deg); }
        .left { transform: translateX(-90px) rotateY(-90deg); }
        .top {
            transform: translateY(-90px) rotateX(90deg);
            box-shadow: 0 0 50px 8px #00fff7, 0 0 60px 15px #7f5fff;
            background: linear-gradient(120deg, rgba(0,255,247,0.12) 60%, rgba(127,95,255,0.10) 100%);
            border-color: var(--neon-cyan);
            opacity: 0.95;
        }
        .bottom { transform: translateY(90px) rotateX(-90deg); }

        @keyframes float {
            0%, 100% { transform: rotateY(-28deg) rotateX(18deg) translateY(0); }
            50% { transform: rotateY(-28deg) rotateX(18deg) translateY(-15px); }
        }

        .click-effect {
            position: absolute;
            width: 100%;
            height: 100%;
            border: 2px solid var(--neon-cyan);
            border-radius: 50%;
            animation: clickRipple 0.6s ease-out;
            pointer-events: none;
        }

        @keyframes clickRipple {
            0% {
                transform: scale(0);
                opacity: 1;
            }
            100% {
                transform: scale(2.5);
                opacity: 0;
            }
        }

        /* ===== EFEITO DE CAMADAS (MOBILE) ===== */
        #layer-transition {
            position: absolute;
            left: 0; top: 0;
            width: 100%; height: 100%;
            pointer-events: none;
            z-index: 10;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .layer {
            position: absolute;
            left: 50%; top: 50%;
            width: 100vw; height: 100vh;
            background: rgba(0, 255, 255, 0.08);
            border: 2px solid var(--neon-cyan);
            box-shadow: 0 0 30px #00fff7, 0 0 60px #0ff;
            opacity: 0;
            transition: 
                opacity 0.4s, 
                width 0.7s cubic-bezier(.77,0,.18,1), 
                height 0.7s cubic-bezier(.77,0,.18,1), 
                left 0.7s cubic-bezier(.77,0,.18,1), 
                top 0.7s cubic-bezier(.77,0,.18,1);
            border-radius: 15px;
            transform: translate(-50%, -50%);
        }
        .layer1 { transition-delay: 0s; }
        .layer2 { transition-delay: 0.15s; }
        .layer3 { transition-delay: 0.3s; }

        /* Animações de desmontagem (ajustadas para mobile) */
        .box-3d.desmontar .front {
            transform: translateZ(300px) rotateY(0deg) scale(1.1);
            opacity: 0.7;
        }
        .box-3d.desmontar .back {
            transform: translateZ(-300px) rotateY(0deg) scale(1.1);
            opacity: 0.7;
        }
        .box-3d.desmontar .right {
            transform: translateX(300px) rotateY(0deg) scale(1.1);
            opacity: 0.7;
        }
        .box-3d.desmontar .left {
            transform: translateX(-300px) rotateY(0deg) scale(1.1);
            opacity: 0.7;
        }
        .box-3d.desmontar .top {
            transform: translateY(-300px) rotateX(0deg) scale(1.1);
            opacity: 0.7;
        }
        .box-3d.desmontar .bottom {
            transform: translateY(300px) rotateX(0deg) scale(1.1);
            opacity: 0.7;
        }

        .box-3d.alinhar {
          transition: transform 1.2s cubic-bezier(.77,0,.18,1);
          transform: rotateY(0deg) rotateX(0deg) scale(1.8) translateY(5vh);
        }
        .box-3d.alinhar .front {
          transform: translateZ(0px) rotateY(0deg);
          opacity: 1;
        }
        .box-3d.alinhar .back {
          transform: translateZ(-30px) rotateY(0deg);
          opacity: 1;
        }
        .box-3d.alinhar .right {
          transform: translateZ(-60px) rotateY(0deg);
          opacity: 1;
        }
        .box-3d.alinhar .left {
          transform: translateZ(-90px) rotateY(0deg);
          opacity: 1;
        }
        .box-3d.alinhar .top {
          transform: translateZ(-120px) rotateY(0deg);
          opacity: 1;
        }
        .box-3d.alinhar .bottom {
          transform: translateZ(-150px) rotateY(0deg);
          opacity: 1;
        }

        .titulo-topo {
          width: 100%;
          text-align: center;
          margin-bottom: 20px;
          z-index: 100;
          position: relative;
          padding: 0 20px;
        }
        .titulo-topo h1 {
          color: var(--neon-cyan);
          font-family: 'Courier New', monospace;
          font-size: 2rem;
          letter-spacing: 0.15em;
          text-shadow: 0 0 15px var(--neon-cyan), 0 0 25px #7f5fff;
          font-weight: bold;
          margin: 0 auto 8px auto;
          display: inline-block;
        }
        .cp-face {
          display: flex;
          align-items: center;
          justify-content: center;
          font-size: 1.8rem;
          font-family: 'Courier New', monospace;
          color: var(--neon-cyan);
          text-shadow: 0 0 10px var(--neon-cyan), 0 0 20px #7f5fff;
          font-weight: bold;
          letter-spacing: 0.1em;
          gap: 0.3em;
        }

        /* Botão mobile otimizado */
        .mobile-button {
            background: var(--bg-dark);
            color: var(--neon-cyan);
            border: 2px solid var(--neon-cyan);
            border-radius: 8px;
            padding: 16px 32px;
            font-weight: bold;
            font-size: 1.1rem;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: none !important;
            text-shadow: none !important;
            touch-action: manipulation;
            min-height: 48px; /* Tamanho mínimo recomendado para touch */
            margin-top: 20px;
            margin-bottom: 20px; /* Espaço extra para não sobrepor controles */
        }

        .mobile-button:active {
            transform: translateY(1px) scale(0.98);
            background: rgba(0,255,247,0.1);
        }

        .fade-vinheta {
          position: fixed;
          left: 0; top: 0;
          width: 100vw;
          height: 100vh;
          pointer-events: none;
          z-index: 99999;
          background: radial-gradient(circle at 50% 50%, rgba(10,10,13,0) 0%, rgba(10,10,13,0.7) 60%, rgba(10,10,13,0.98) 100%);
          opacity: 0;
          transition: opacity 0.7s;
        }
        .fade-vinheta.fade-in {
          animation: vinhetaFade 1.2s cubic-bezier(.77,0,.18,1) forwards;
        }
        @keyframes vinhetaFade {
          0% {
            opacity: 0;
            background: radial-gradient(circle at 50% 50%, rgba(10,10,13,0) 0%, rgba(10,10,13,0.7) 60%, rgba(10,10,13,0.98) 100%);
          }
          70% {
            opacity: 1;
            background: radial-gradient(circle at 50% 50%, rgba(10,10,13,0.7) 40%, rgba(10,10,13,0.98) 100%);
          }
          100% {
            opacity: 1;
            background: radial-gradient(circle at 50% 50%, rgba(10,10,13,1) 100%, rgba(10,10,13,1) 100%);
            }
        }

        /* Botões de controle mobile */
        .mobile-controls {
            position: fixed;
            bottom: 20px;
            left: 20px;
            right: 20px;
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            z-index: 1000;
            gap: 10px;
        }

        .mobile-control-button {
            background: rgba(0,255,247,0.1);
            border: 1px solid var(--neon-cyan);
            border-radius: 6px;
            padding: 8px 12px;
            color: var(--neon-cyan);
            text-decoration: none;
            font-size: 0.8rem;
            text-shadow: 0 0 4px var(--neon-cyan);
            transition: all 0.3s ease;
            box-shadow: 0 0 8px rgba(0,255,247,0.2);
            cursor: pointer;
            touch-action: manipulation;
            min-height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex: 1;
            max-width: 120px;
        }

        .mobile-control-button:active {
            background: rgba(0,255,247,0.2);
            transform: scale(0.95);
        }

        .mobile-info {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 8px;
            max-width: 140px;
        }

        .mobile-info a {
            color: var(--neon-yellow);
            text-decoration: none;
            font-size: 0.7rem;
            text-shadow: 0 0 6px var(--neon-yellow);
            transition: all 0.3s ease;
            text-align: right;
        }

        /* Ajustes para telas muito pequenas */
        @media (max-width: 480px) {
            .box-3d {
                width: 150px;
                height: 150px;
            }
            
            .face {
                width: 150px;
                height: 150px;
                font-size: 14px;
            }
            
            .front { transform: translateZ(75px) rotateY(0deg); }
            .back { transform: translateZ(-75px) rotateY(180deg); }
            .right { transform: translateX(75px) rotateY(90deg); }
            .left { transform: translateX(-75px) rotateY(-90deg); }
            .top { transform: translateY(-75px) rotateX(90deg); }
            .bottom { transform: translateY(75px) rotateX(-90deg); }
            
            .titulo-topo h1 {
                font-size: 1.6rem;
            }
            
            .cp-face {
                font-size: 1.4rem;
            }
            
            .mobile-button {
                font-size: 1rem;
                padding: 14px 28px;
            }
        }

        /* Ajustes para landscape mobile */
        @media (max-height: 600px) and (orientation: landscape) {
            .container {
                padding: 10px;
            }
            
            .titulo-topo {
                margin-bottom: 10px;
            }
            
            .titulo-topo h1 {
                font-size: 1.4rem;
            }
            
            .box-3d {
                width: 140px;
                height: 140px;
            }
            
            .face {
                width: 140px;
                height: 140px;
                font-size: 12px;
            }
            
            .front { transform: translateZ(70px) rotateY(0deg); }
            .back { transform: translateZ(-70px) rotateY(180deg); }
            .right { transform: translateX(70px) rotateY(90deg); }
            .left { transform: translateX(-70px) rotateY(-90deg); }
            .top { transform: translateY(-70px) rotateX(90deg); }
            .bottom { transform: translateY(70px) rotateX(-90deg); }
            
            .mobile-button {
                margin-top: 20px;
                font-size: 0.9rem;
                padding: 12px 24px;
            }
        }
    </style>
</head>
<body>
    <div class="scanlines"></div>
    <div class="particles" id="particles"></div>
    <header class="titulo-topo">
      <h1>CAIXA PRETA</h1>
    </header>
    <div class="fade-vinheta" id="fadeVinheta"></div>
    <div class="container">
        <div class="box-3d" id="box3d">
            <div class="face front"><span class="cp-face">🤖 CP</span></div>
            <div class="face back"></div>
            <div class="face right"></div>
            <div class="face left"></div>
            <div class="face top"></div>
            <div class="face bottom"></div>
        </div>
        <div id="layer-transition" style="display:none;">
          <div class="layer layer1"></div>
          <div class="layer layer2"></div>
          <div class="layer layer3"></div>
        </div>
        
        <!-- Botão abaixo do cubo -->
        <a href="2-chat.html" class="mobile-button" id="startButton">Iniciar Jornada</a>
    </div>

    <script>
        const box = document.getElementById('box3d');
        const startButton = document.getElementById('startButton');
        let desmontada = false;
        
        // Função para alternar áudio
        function toggleAudio() {
            if (isAudioEnabled()) {
                disableAudio();
                updateAudioButton();
            } else {
                enableAudio();
                updateAudioButton();
            }
        }
        
        // Atualiza o visual do botão
        function updateAudioButton() {
            const button = document.getElementById('audio-toggle');
            if (isAudioEnabled()) {
                button.textContent = '🔇 desativar áudio';
                button.style.background = 'rgba(255,74,74,0.1)';
                button.style.borderColor = '#ff4a4a';
                button.style.color = '#ff4a4a';
                button.style.textShadow = '0 0 4px #ff4a4a';
            } else {
                button.textContent = '🔊 ativar áudio';
                button.style.background = 'rgba(0,255,247,0.1)';
                button.style.borderColor = 'var(--neon-cyan)';
                button.style.color = 'var(--neon-cyan)';
                button.style.textShadow = '0 0 4px var(--neon-cyan)';
            }
        }
        
        // Inicializa o botão ao carregar a página
        document.addEventListener('DOMContentLoaded', function() {
            updateAudioButton();
        });
        
        // Event listener para toque na caixa
        box.addEventListener('touchstart', function(e) {
            e.preventDefault();
            if (desmontada) return;
            
            // Adiciona feedback tátil se disponível
            if (navigator.vibrate) {
                navigator.vibrate(50);
            }
            
            desmontada = true;
            
            // Som de acesso/carregando
            playAccessSound();
            
            box.classList.add('desmontar');
            setTimeout(() => {
                box.classList.add('alinhar');
                setTimeout(() => {
                    // Efeito de vinheta/fade
                    const fade = document.getElementById('fadeVinheta');
                    fade.classList.add('fade-in');
                    setTimeout(() => {
                        window.location.href = '2-chat.html';
                    }, 1300);
                }, 1200);
            }, 1200);
        });
        
        // Também mantém o clique para compatibilidade
        box.addEventListener('click', function(e) {
            if (desmontada) return;
            desmontada = true;
            
            // Som de acesso/carregando
            playAccessSound();
            
            box.classList.add('desmontar');
            setTimeout(() => {
                box.classList.add('alinhar');
                setTimeout(() => {
                    // Efeito de vinheta/fade
                    const fade = document.getElementById('fadeVinheta');
                    fade.classList.add('fade-in');
                    setTimeout(() => {
                        window.location.href = '2-chat.html';
                    }, 1300);
                }, 1200);
            }, 1200);
        });

        // Particle emitter
        function createParticle() {
            const particle = document.createElement('div');
            particle.className = 'particle';
            particle.style.left = Math.random() * 100 + 'vw';
            particle.style.animationDelay = Math.random() * 6 + 's';
            document.getElementById('particles').appendChild(particle);
            
            setTimeout(() => {
                particle.remove();
            }, 6000);
        }

        // Create particles periodically
        setInterval(createParticle, 400);

        // Efeito de hover/touch para mobile
        let hoverSoundPlayed = false;
        
        box.addEventListener('touchstart', function() {
            if (!hoverSoundPlayed) {
                playHoverSound();
                hoverSoundPlayed = true;
            }
        });
        
        // Feedback visual para toque
        box.addEventListener('touchstart', function() {
            this.style.transform = 'rotateY(15deg) rotateX(15deg) scale(1.05)';
        });
        
        box.addEventListener('touchend', function() {
            this.style.transform = 'rotateX(0deg) rotateY(0deg) scale(1)';
            hoverSoundPlayed = false;
        });

        // Prevenir zoom duplo toque
        let lastTouchEnd = 0;
        document.addEventListener('touchend', function (event) {
            const now = (new Date()).getTime();
            if (now - lastTouchEnd <= 300) {
                event.preventDefault();
            }
            lastTouchEnd = now;
        }, false);

        // Prevenir scroll horizontal
        document.addEventListener('touchmove', function(e) {
            if (e.touches.length > 1) {
                e.preventDefault();
            }
        }, { passive: false });
    </script>
    
    <!-- Controles mobile -->
    <div class="mobile-controls">
        <button id="audio-toggle" onclick="toggleAudio()" class="mobile-control-button">🔊 ativar áudio</button>
        <div class="mobile-info">
            <a href="https://dayaneargentino.notion.site/Dayane-Argentino-Dias-2076e1d8545c805b9e09d97b773f9443?source=copy_link" target="_blank">por Dayane Argentino</a>
            <a href="9-vibe-coding-desprogramativo.html" class="mobile-control-button" style="max-width: none; flex: none; padding: 6px 10px; font-size: 0.7rem;">informações</a>
        </div>
    </div>
</body>
</html>
